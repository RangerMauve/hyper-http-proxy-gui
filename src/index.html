<!doctype html>
<title>Setkamost</title>
<h1>Setkamost</h1>
<p>Status: <span>loading</span></p>
<section>
  <h2>Expose Local</h2>
  <ul id="localPorts"></ul>
  <form id="addLocalPort">
    <input type="number" name="port" placeholder="Local port (e.g. 3000)" required min="1" max="65535" />
    <button type="submit">➕ Expose</button>
  </form>
</section>
<section>
  <h2>Expose Remote As Local</h2>
  <ul id="remotePorts"></ul>
  <form id="addRemotePort">
    <input type="text" name="url" placeholder="Remote URL (e.g. hyper://…)" required />
    <input type="number" name="defaultPort" placeholder="Local port (optional)" min="0" max="65535" />
    <button type="submit">➕ Expose</button>
  </form>
</section>
<section>
  <h2>Share Folders</h2>
  <ul id="folderPorts"></ul>
  <form id="addFolder">
    <input type="text" placeholder="Path to folder" name="rootFolder" />
    <button type="button" id="selectFolderBtn">📁 Choose Folder</button>
    <button type="submit">➕ Expose</button>
  </form>
</section>

<script type="module">
  async function loadState() {
    const state = await window.proxyApi.toJSON();

    const localList = document.getElementById("localPorts");
    const remoteList = document.getElementById("remotePorts");
    const folderList = document.getElementById("folderPorts");

    localList.innerHTML = "";
    remoteList.innerHTML = "";
    folderList.innerHTML = "";

    for (const [port, seed] of Object.entries(state.localPorts)) {
      const li = document.createElement("li");
      li.textContent = `Port ${port} → ${seed}`;
      localList.appendChild(li);
    }

    for (const [url, port] of Object.entries(state.remoteProxies)) {
      const li = document.createElement("li");
      li.textContent = `${port} → ${url}`;
      remoteList.appendChild(li);
    }

    for (const [folder, seed] of Object.entries(state.folders)) {
      const li = document.createElement("li");
      li.textContent = `${folder} → ${seed}`;
      folderList.appendChild(li);
    }
  }

  document.getElementById("addLocalPort").addEventListener("submit", async (e) => {
    e.preventDefault();
    const formData = new FormData(e.target);
    await window.proxyApi.exposeLocalPort(Number(formData.get("port")), "");
    e.target.reset();
    await loadState();
  });

  document.getElementById("addRemotePort").addEventListener("submit", async (e) => {
    e.preventDefault();
    const formData = new FormData(e.target);
    const port = formData.get("defaultPort") ? Number(formData.get("defaultPort")) : 0;
    await window.proxyApi.exposeRemoteAsLocal(formData.get("url"), port);
    e.target.reset();
    await loadState();
  });

  const addFolderForm = document.getElementById("addFolder");
  const folderInput = addFolderForm.querySelector('[name="rootFolder"]');

  document.getElementById("selectFolderBtn").addEventListener("click", async () => {
    const path = await window.proxyApi.selectFolder();
    if (path) folderInput.value = path;
  });

  addFolderForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!folderInput.value) return;
    await window.proxyApi.exposeFolder(folderInput.value, "");
    folderInput.value = "";
    await loadState();
  });

  loadState();
</script>
